<!DOCTYPE html>
<html lang="fr" data-theme="vert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma commande - BeniGo</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/commande.css">
<script src="js/theme.js"></script>
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">Beni<span>Go</span></a>
    <nav class="nav">
      <a href="annonces.html">Annonces</a>
      <a href="publier.html">Vendre</a>
      <a href="profil.html">Mon profil</a>
    </nav>
  </div>
</header>

<main class="wrap order">
  <p class="alert error" id="error" hidden></p>

  <div id="orderBody" hidden>
    <div class="spread order-head">
      <div>
        <h1>Commande <span id="ref"></span></h1>
        <p class="muted small" id="createdAt"></p>
      </div>
      <span class="badge" id="statusBadge"></span>
    </div>

    <div class="order-grid">
      <section class="card">
        <h2>Suivi</h2>
        <ol class="timeline" id="timeline"></ol>

        <div class="actions" id="actions"></div>
        <p class="alert" id="actionMessage" hidden></p>
      </section>

      <aside class="card handoff">
        <h2>Code de remise</h2>
        <p class="small muted" id="handoffHint"></p>
        <div class="qr" id="qr"></div>
        <p class="code" id="code"></p>
        <p class="small muted">Reference : <span id="qrRef"></span></p>
      </aside>
    </div>

    <section class="card order-recap">
      <h2>Recapitulatif</h2>
      <div class="recap-row"><span>Article</span><strong id="itemTitle"></strong></div>
      <div class="recap-row"><span>Vendeur</span><strong id="sellerName"></strong></div>
      <div class="recap-row"><span>Acheteur</span><strong id="buyerName"></strong></div>
      <div class="recap-row"><span>Livraison</span><strong id="deliveryMode"></strong></div>
      <div class="recap-row"><span>Montant a payer a la remise</span><strong id="amount"></strong></div>
      <div class="recap-row"><span>Paiement</span><strong>Especes ou mobile money, a la remise</strong></div>
    </section>
  </div>
</main>

<script src="js/qrcode.min.js"></script>
<script type="module" src="js/commande.js"></script>
</body>
</html>
